<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <title>R&M E-Files</title>
    </head>
    <body>
        <div class="app">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h1>E-File</h1>
                    <p>Rick & Morty Database</p>
                </div>
                <div class="search-container">
                    <input type="text" id="search" placeholder="Search...">
                </div>
                <div class="character-list" id="character-list">
                </div>
            </aside>
            <main class="content">
                <header class="content-header">
                    <div>
                        <span class="document-label">Electronic File</span>
                        <h2>Personnel File</h2>
                    </div>
                    <span class="file-number" id="file-number">
                        FILE #0000
                    </span>
                </header>
                <section class="file">
                    <div class="profile">
                        <img
                        id="character-image"
                        alt="Character Image"
                    >

                    <div class="profile-info">
                        <span class="label">NAME</span>
                        <h3 id="character-name">-</h3>

                        <span class="status alive" id="character-status">
                            ● Unknown
                        </span>
                    </div>

                </div>


                <!-- Stammdaten -->
                <div class="section">

                    <h4>Master Data</h4>

                    <div class="data-grid">

                        <div class="data-item">
                            <span class="label">Species</span>
                            <strong id="character-species">-</strong>
                        </div>

                        <div class="data-item">
                            <span class="label">Sex</span>
                            <strong id="character-gender">-</strong>
                        </div>

                        <div class="data-item">
                            <span class="label">Origin</span>
                            <strong id="character-origin">-</strong>
                        </div>

                        <div class="data-item">
                            <span class="label">Last Seen</span>
                            <strong id="character-location">-</strong>
                        </div>

                    </div>

                </div>
                </section>
            </main>
        </div>
        <script src="js/api.js"></script>
        <script src="js/app.js"></script>
        <!-- Most Wanted Banner -->
<div class="wanted-banner">

    <div class="wanted-label">
        ATTENTION!
    </div>

    <div class="wanted-ticker">

        <div class="wanted-content">

            <img
                src="https://rickandmortyapi.com/api/character/avatar/11.jpeg"
    alt="Albert Einstein"
            >

            <strong>
                ALBERT EINSTEIN
            </strong>

            <span>
                MOST WANTED — FOUND
            </span>

            <span>
                STATUS: DEAD
            </span>

            <span>
                FILE #1879
            </span>

        </div>

    </div>

</div>

    </body>
</html>
